[project]
name = "narcisse"
version = "0.0.0"
description = "Ce qu'Internet sait de toi, et comment le réduire : un outil d'auto-OSINT local, passif par défaut."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "fastapi>=0.142.4",
    "httpx>=0.28.1",
    "platformdirs>=4.12.4",
    "sqlalchemy[asyncio]>=2.1.4",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
narcisse = "narcisse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The built UI is ignored by git but ships in the package (sdist and wheel alike).
artifacts = ["src/narcisse/web/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/narcisse"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
    "watchfiles>=1.3.0",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "C4", "PIE", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"] # French text has non-ASCII quotes and apostrophes

[tool.ruff.lint.per-file-ignores]
"src/narcisse/storage/models.py" = ["RUF012"] # SQLAlchemy class-level declarations

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["narcisse.storage.migrations.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
